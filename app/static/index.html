<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flight Agent</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%88%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>✈︎ Flight Agent</h1>
      <p class="tagline">Ask in plain English. It plans the search, runs it, and reports back.</p>
    </div>
  </header>

  <main>
    <form id="ask-form" class="card ask-card" autocomplete="off">
      <label for="question" class="sr-only">Your flight question</label>
      <textarea id="question" name="question" rows="3" required
        placeholder="Singapore Airlines, Singapore to the USA, round trip. Leave in Dec 2026, back in Jan 2027, 30-day trip, business class. Find me the best rate and which dates."></textarea>
      <div class="ask-actions">
        <span id="agent-status" class="agent-status"></span>
        <button type="submit" class="primary" id="ask-button">Search</button>
      </div>
    </form>

    <div class="examples" id="examples">
      <span>Try:</span>
      <button type="button" data-q="Singapore Airlines, Singapore to the USA, round trip. Leave December 2026, back January 2027, 30-day trip, business class. Best rate and which dates?">SQ to the US in business</button>
      <button type="button" data-q="Cheapest week to fly SIN to Tokyo in March 2027, economy, non-stop only">SIN → Tokyo, cheapest week</button>
      <button type="button" data-q="I want to go somewhere in Europe from Singapore for 2 weeks in May 2027. Economy. Where is cheapest?">Anywhere in Europe</button>
    </div>

    <section id="activity" class="activity" hidden>
      <div class="activity-head">
        <h2>What the agent is doing</h2>
        <button type="button" id="toggle-activity" class="linkish">hide</button>
      </div>
      <ol id="activity-log" class="activity-log"></ol>
      <div id="progress-wrap" class="progress-wrap" hidden>
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <span id="progress-label" class="progress-label"></span>
      </div>
    </section>

    <section id="answer" class="answer card" hidden></section>
    <section id="results" class="results"></section>
    <section id="calendar-section" class="card calendar-section" hidden>
      <h2>Price calendar</h2>
      <p class="muted" id="calendar-caption"></p>
      <div id="chart-wrap" class="chart-wrap">
        <svg id="chart" role="img" aria-label="Cheapest fare by departure date"></svg>
        <div id="chart-tip" class="chart-tip" hidden></div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
